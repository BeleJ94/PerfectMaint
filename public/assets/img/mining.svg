<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18222e"/>
      <stop offset=".4" stop-color="#34404c"/>
      <stop offset=".58" stop-color="#86684a"/>
      <stop offset=".66" stop-color="#b48656"/>
    </linearGradient>
    <linearGradient id="dust" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".4" stop-color="#c79a66" stop-opacity="0"/>
      <stop offset="1" stop-color="#c79a66" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5140"/><stop offset="1" stop-color="#58432f"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#57402f"/><stop offset="1" stop-color="#463324"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43301f"/><stop offset="1" stop-color="#34261a"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#302219"/><stop offset="1" stop-color="#1f1711"/></linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="520" r="60" fill="#e2b77c" opacity=".3"/>

  <!-- Horizon et gradins de la fosse -->
  <path d="M0 575 L220 550 L420 565 L640 535 L860 558 L1100 540 L1360 560 L1600 548 L1600 900 L0 900Z" fill="#7a5c45" opacity=".8"/>
  <path d="M0 610 L1600 596 L1600 900 L0 900Z" fill="url(#t1)"/>
  <path d="M0 610 L1600 596 L1600 606 L0 622Z" fill="#8f6d51" opacity=".6"/>
  <path d="M0 668 L1600 656 L1600 900 L0 900Z" fill="url(#t2)"/>
  <path d="M0 668 L1600 656 L1600 666 L0 680Z" fill="#7a5a41" opacity=".6"/>
  <path d="M0 738 L1600 726 L1600 900 L0 900Z" fill="url(#t3)"/>
  <path d="M0 738 L1600 726 L1600 737 L0 750Z" fill="#6a4d37" opacity=".55"/>
  <path d="M0 818 L1600 806 L1600 900 L0 900Z" fill="url(#t4)"/>
  <path d="M0 818 L1600 806 L1600 817 L0 830Z" fill="#553c2a" opacity=".5"/>

  <!-- Piste d'accès en lacets -->
  <path d="M1600 628 L1000 640 L1060 700 L240 712 L300 776 L1600 768" fill="none" stroke="#9a7a5c" stroke-width="7" opacity=".3" stroke-linejoin="round"/>

  <!-- Dumper lointain sur le 1er gradin -->
  <g transform="translate(1260 584) scale(.22)" fill="#1a1512">
    <path d="M0 40 L20 0 L150 0 L165 40 Z"/>
    <rect x="150" y="10" width="45" height="35"/>
    <rect x="-5" y="40" width="205" height="22"/>
    <circle cx="30" cy="78" r="26"/><circle cx="165" cy="78" r="26"/>
  </g>

  <!-- Pelle hydraulique sur le 2e gradin -->
  <g transform="translate(700 598) scale(.62)" fill="#15110e">
    <rect x="0" y="110" width="210" height="34" rx="17"/>
    <rect x="20" y="80" width="170" height="36" rx="4"/>
    <rect x="30" y="30" width="120" height="54" rx="3"/>
    <rect x="130" y="10" width="54" height="74" rx="3"/>
    <rect x="140" y="20" width="34" height="26" fill="#d9a766" opacity=".5"/>
    <path d="M60 40 L-110 -60 L-100 -78 L78 24 Z"/>
    <path d="M-110 -60 L-170 60 L-150 66 L-96 -52 Z"/>
    <path d="M-178 52 L-120 58 L-128 104 L-190 96 Z"/>
  </g>

  <!-- Dumper au premier plan -->
  <g transform="translate(180 700) scale(.62)" fill="#0f0c0a">
    <path d="M0 110 L50 10 L400 0 L440 110 Z"/>
    <path d="M40 18 L400 6 L405 20 L45 32 Z" fill="#1e1814"/>
    <rect x="400" y="30" width="120" height="90" rx="4"/>
    <rect x="420" y="42" width="72" height="36" fill="#d9a766" opacity=".4"/>
    <rect x="-10" y="110" width="545" height="50" rx="4"/>
    <rect x="520" y="120" width="30" height="16" fill="#e8c38a" opacity=".65"/>
    <circle cx="90" cy="195" r="68"/><circle cx="90" cy="195" r="26" fill="#2a221c"/>
    <circle cx="430" cy="195" r="68"/><circle cx="430" cy="195" r="26" fill="#2a221c"/>
  </g>

  <rect width="1600" height="900" fill="url(#dust)"/>
</svg>
